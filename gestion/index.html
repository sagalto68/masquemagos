#gate button{width:100%;padding:12px;border-radius:10px;border:none;background:var(--gold-btn);color:#fff;font-weight:600;font-size:14px}
#gate .err{color:#B91C1C;font-size:12.5px;margin-top:8px;display:none}

/* ---- app shell ---- */
#app{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--dark);color:#F5EFE4;display:flex;flex-direction:column;flex-shrink:0}

.sidebar nav button:hover{background:rgba(245,239,228,.06);color:#F5EFE4}
.sidebar nav button.active{background:rgba(232,195,122,.15);color:var(--dark-accent);border-left-color:var(--dark-accent);font-weight:700}
.sidebar .foot{padding:16px;font-size:11px;color:rgba(245,239,228,.35);border-top:1px solid rgba(245,239,228,.1)}
main{flex:1;padding:32px 36px;overflow-y:auto;max-height:100vh}

.mobile-topbar{display:none}

#toast{position:fixed;bottom:24px;right:24px;background:var(--dark);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;opacity:0;transform:translateY(10px);transition:all .25s ease;z-index:200}

.drawer{width:420px;max-width:90vw;background:#fff;height:100%;padding:28px;overflow-y:auto}

@media print{

</style>

// ---------------- DASHBOARD ----------------
function callSection(icon, title, calls, todayStr, quickActions){
  const hoy = calls.filter(c=>c.due_date === todayStr);
  const atrasadas = calls.filter(c=>c.due_date < todayStr);
  const proximas = calls.filter(c=>c.due_date > todayStr).slice(0, 3);

  function row(c, overdue){
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F1EBDD">
      <div style="min-width:0"><div style="font-size:13.5px;font-weight:600">${c.clients?.name||'—'}</div><div style="font-size:12px;color:var(--muted)">${c.reason}</div></div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <span style="font-size:11.5px;font-weight:600;color:${overdue?'#991B1B':'var(--gold-btn)'}">${fmtDate(c.due_date)}</span>
        ${quickActions(c.clients?.phone)}
      </div></div>`;
  }

  return `
    <div class="card">
      <h3 style="font-size:16px;margin-bottom:12px">${icon} ${title}</h3>
      ${calls.length===0?'<p style="font-size:13px;color:var(--muted)">Nada pendiente 🎉</p>':''}

        <div style="font-size:11px;font-weight:700;color:#166534;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Para hoy</div>

      `:''}

        ${proximas.map(c=>row(c,false)).join('')}
      `:''}
      ${calls.length>0?`<button onclick="goTo('llamadas')" style="background:none;border:none;color:var(--gold-btn);font-size:12.5px;font-weight:600;margin-top:10px;cursor:pointer">Ver todas →</button>`:''}
    </div>`;
}
function viewDashboard(){
  const activos = STATE.clients.filter(c => !['perdido','confirmado'].includes(c.status)).length;
  const todayMidnight = new Date(); todayMidnight.setHours(0,0,0,0);
  const in14 = new Date(todayMidnight); in14.setDate(in14.getDate()+14);
  const todayStr = todayMidnight.toISOString().slice(0,10);
  const tomorrowStr = new Date(todayMidnight.getTime()+86400000).toISOString().slice(0,10);

  const bolosFuturos = STATE.gigs.filter(g => g.event_date && new Date(g.event_date) >= todayMidnight);
  const confirmados = bolosFuturos.length;
  const pendientes = STATE.calls.length;
  const proximosBolos = bolosFuturos.filter(g => new Date(g.event_date) <= in14).sort((a,b)=>new Date(a.event_date)-new Date(b.event_date));

  const sinMago = bolosFuturos.filter(g => new Date(g.event_date) <= in14 && !g.magician).sort((a,b)=>new Date(a.event_date)-new Date(b.event_date));

  const nowMonth = new Date().toISOString().slice(0,7);
  const nowYear = new Date().getFullYear();
  const facturadoMes = STATE.gigs.filter(g => {
    const gigMonth = g.billing_month || (g.event_date ? g.event_date.slice(0,7) : null);
    return gigMonth === nowMonth && g.price;
  }).reduce((s,g)=>s+Number(g.price),0);
  const facturadoAnio = STATE.gigs.filter(g => {
    const gigMonth = g.billing_month || (g.event_date ? g.event_date.slice(0,7) : null);
    return gigMonth && gigMonth.startsWith(String(nowYear)) && g.price;
  }).reduce((s,g)=>s+Number(g.price),0);
  const monthlyGoal = Number(STATE.settings?.monthly_goal || 0);
  const annualGoal = Number(STATE.settings?.annual_goal || 0);
  const monthlyPct = monthlyGoal>0 ? Math.min(100, facturadoMes/monthlyGoal*100) : 0;
  const annualPct = annualGoal>0 ? Math.min(100, facturadoAnio/annualGoal*100) : 0;

  const today = new Date();
  const coldLeads = STATE.clients.filter(c => {
    if(['perdido','confirmado'].includes(c.status)) return false;
    if(!c.status_updated_at) return false;
    const days = (today - new Date(c.status_updated_at)) / (1000*60*60*24);
    return days >= 5;
  }).sort((a,b)=>new Date(a.status_updated_at)-new Date(b.status_updated_at));

  function quickActions(phone){
    if(!phone) return '';
    const clean = phone.replace(/[^0-9+]/g,'');
    return `<div style="display:flex;gap:6px;flex-shrink:0" onclick="event.stopPropagation()">

async function saveGoals(){

function toggleOtroSource(){
  const isOtro = document.getElementById('nc-source').value === 'Otro';
  document.getElementById('nc-source-otro-wrap').style.display = isOtro ? 'block' : 'none';
}
function checkDuplicateClient(){
  const name = document.getElementById('nc-name').value.trim().toLowerCase();
  const phone = document.getElementById('nc-phone').value.trim();
  const warningBox = document.getElementById('nc-duplicate-warning');
  if(!name && !phone){ warningBox.style.display = 'none'; return; }
  const match = STATE.clients.find(c =>
    (name.length>2 && c.name.trim().toLowerCase() === name) ||
    (phone.length>5 && c.phone && c.phone.replace(/\s/g,'') === phone.replace(/\s/g,''))
  );
  if(match){
    warningBox.style.display = 'block';
    warningBox.innerHTML = `⚠️ Ya existe un cliente parecido: <strong>${match.name}</strong> ${match.phone?'('+match.phone+')':''} — revisa si es la misma persona antes de crear uno nuevo.`;
  } else {
    warningBox.style.display = 'none';
  }
}
async function saveClient(){
  const sourceValue = document.getElementById('nc-source').value;
  const source = sourceValue === 'Otro' ? document.getElementById('nc-source-otro').value : sourceValue;
  const budget = document.getElementById('nc-budget').value;
  const notesText = document.getElementById('nc-notes').value;
  const payload = {
    name: document.getElementById('nc-name').value,
    type: document.getElementById('nc-type').value,
    event_type: document.getElementById('nc-event').value,
    phone: document.getElementById('nc-phone').value,
    email: document.getElementById('nc-email').value,
    locality: document.getElementById('nc-locality').value,
    province: document.getElementById('nc-province').value,
    source: source,
    event_date: document.getElementById('nc-date').value || null,
    budget_estimate: budget ? Number(budget) : null,
  };
  if(!payload.name){ toast('Ponle un nombre al cliente'); return; }
  const {data, error} = await sb.from('clients').insert(payload).select().single();
  if(error){ toast('Error al guardar'); console.error(error); return; }
  if(notesText.trim()){
    await sb.from('notes').insert({client_id: data.id, text: notesText.trim()});
  }
  closeDrawer(); await loadAll(); render(); toast('Cliente guardado');
}

  if(status === 'presupuestado' && previous?.status !== 'presupuestado'){

async function addCall(clientId){

async function addGig(clientId){
  const place = document.getElementById('ng-place').value;
  const date = document.getElementById('ng-date').value;
  const time = document.getElementById('ng-time').value;
  const magicianId = document.getElementById('ng-magician').value;
  const magicianManual = document.getElementById('ng-magician-manual').value;
  const magicianObj = STATE.magicians.find(m=>m.id===magicianId);
  const magicianName = magicianManual || magicianObj?.name || null;
  const magicianStatus = document.getElementById('ng-magician-status').value;
  const price = document.getElementById('ng-price').value;
  const billingMonth = readBillingMonth('ng-billing-month');
  if(!date){ toast('Ponle al menos una fecha al bolo'); return; }
  await sb.from('gigs').insert({client_id: clientId, place, event_date: date, event_time: time, magician_id: magicianManual?null:(magicianId||null), magician: magicianName, magician_status: magicianStatus, price: price?Number(price):null, billing_month: billingMonth});
  if(magicianStatus === 'confirmado'){
    const feedbackDate = new Date(date);
    feedbackDate.setDate(feedbackDate.getDate() + 1);

      client_id: clientId,
      reason: `Pedir feedback del bolo${place?' en '+place:''}`,

function viewCalendario(){
  const gigs = STATE.gigs.filter(g=>g.event_date);
  const gigsByDay = {};
  gigs.forEach(g=>{ (gigsByDay[g.event_date] ||= []).push(g); });

  const [year, month] = calMonth.split('-').map(Number);
  const firstOfMonth = new Date(year, month-1, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7; // Monday = 0
  const daysInMonth = new Date(year, month, 0).getDate();
  const monthLabel = firstOfMonth.toLocaleDateString('es-ES', {month:'long', year:'numeric'});
  const todayStr = todayLocalStr();

  let cells = '';
  for(let i=0; i<startOffset; i++) cells += `<div></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dayGigs = gigsByDay[dateStr] || [];
    const isToday = dateStr===todayStr;
    const isSelected = dateStr===calSelectedDay;
    cells += `<div onclick="calSelectedDay='${dateStr}'; render()" style="
        aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
        border-radius:10px;cursor:pointer;position:relative;

        font-weight:${isToday||isSelected?'700':'500'};
      ">
      <span style="font-size:13.5px">${day}</span>
      ${dayGigs.length>0?`<span style="width:5px;height:5px;border-radius:50%;background:${isSelected?'#fff':'var(--gold-btn)'};margin-top:2px"></span>`:''}
    </div>`;
  }

  const weekdays = ['L','M','X','J','V','S','D'];
  const selectedGigs = (gigsByDay[calSelectedDay] || []).sort((a,b)=>(a.event_time||'').localeCompare(b.event_time||''));
  const selectedLabel = new Date(calSelectedDay+'T00:00:00').toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'});

  return `
    <h1 style="font-size:24px;margin-bottom:20px">Calendario de bolos</h1>

          <strong style="text-transform:capitalize;font-size:15px">${monthLabel}</strong>
          <button class="btn secondary" style="padding:6px 12px" onclick="calShiftMonth(1)">→</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px">
          ${weekdays.map(w=>`<div style="text-align:center;font-size:11px;color:var(--muted);font-weight:700">${w}</div>`).join('')}
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">
          ${cells}
        </div>
      </div>
      <div>
        <h3 style="font-size:14px;font-weight:700;color:var(--gold-btn);text-transform:capitalize;margin-bottom:12px">${selectedLabel}</h3>
        <div style="display:grid;gap:10px">
          ${selectedGigs.length===0?'<p style="color:var(--muted);font-size:13.5px">Sin bolos este día.</p>':''}
          ${selectedGigs.map(g=>{
            const t = TYPE_STYLES[g.clients?.type] || TYPE_STYLES.particular;
            return `<div class="card" style="display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer" onclick="openGigDetail('${g.id}')">
              <div style="width:44px;height:44px;border-radius:10px;background:var(--warm);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:700;color:var(--gold-btn)">${g.event_time||'—'}</div>
              <div style="flex:1;min-width:0">

                <div style="font-size:12.5px;color:var(--muted)">${g.place||'Lugar sin especificar'} ${g.magician?'· '+g.magician+' '+magoStatusLabel(g.magician_status):''} ${g.price?'· '+Number(g.price).toFixed(2)+'€':''}</div>
              </div>
              ${badge(t)}

          }).join('')}
        </div>
      </div>

  calMonth = `${newY}-${newM}`;
  render();
}

async function saveGigDetails(gigId, clientId){
  const place = document.getElementById('gig-place').value;
  const event_date = document.getElementById('gig-date').value || null;
  const event_time = document.getElementById('gig-time').value;
  const magicianId = document.getElementById('gig-magician').value;
  const magicianManual = document.getElementById('gig-magician-manual').value;
  const magicianObj = STATE.magicians.find(m=>m.id===magicianId);
  const magicianName = magicianManual || magicianObj?.name || null;
  const magicianStatus = document.getElementById('gig-magician-status').value;
  const price = document.getElementById('gig-price').value;
  const billingMonth = readBillingMonth('gig-billing-month');
  const previousGig = STATE.gigs.find(x=>x.id===gigId);
  const wasConfirmed = previousGig?.magician_status === 'confirmado';
  const {error: updGigErr} = await sb.from('gigs').update({place, event_date, event_time, magician_id: magicianManual?null:(magicianId||null), magician: magicianName, magician_status: magicianStatus, price: price?Number(price):null, billing_month: billingMonth}).eq('id', gigId);
  if(updGigErr){
    alert('Error al guardar el bolo: ' + updGigErr.message);
    console.error(updGigErr);
    return;
  }
  if(magicianStatus === 'confirmado' && !wasConfirmed && event_date){
    const feedbackDate = new Date(event_date);
    feedbackDate.setDate(feedbackDate.getDate() + 1);
    await sb.from('calls').insert({
      client_id: clientId || previousGig?.client_id,
      reason: `Pedir feedback del bolo${place?' en '+place:''}`,
      due_date: feedbackDate.toISOString().slice(0,10),
      kind: 'feedback',
    });
  }
  const stacked = document.querySelectorAll('.drawer-bg').length > 1;
  closeAllDrawers(); await loadAll(); render();
  if(stacked && clientId) openClientDetail(clientId);
  toast('Bolo actualizado');
}

  const {count} = await sb.from('documents').select('*', {count:'exact', head:true}).eq('doc_type', type);
  return 698 + (count || 0);
}

function fillClientFiscal(){
  const clientId = document.getElementById('doc-client').value;
  const c = STATE.clients.find(x=>x.id===clientId);
  if(!c) return;
  docMeta.fiscalName = c.name || '';
  render();
}
async function generateDoc(){
  const {subtotal, iva, total} = updateTotalsDisplay();
  const clientId = docMeta.clientId;
  const client = STATE.clients.find(c=>c.id===clientId);
  if(!docMeta.fiscalName || docItems.every(it=>!it.desc)){ toast('Rellena el nombre fiscal y al menos un concepto'); return; }
  const seq = await nextDocSeq(docType);
  const payload = {
    client_id: clientId, doc_number: String(seq), doc_seq: seq, doc_type: docType,
    items: docItems, subtotal, iva, total, doc_date: docMeta.date,
    client_fiscal_name: docMeta.fiscalName, client_nif: docMeta.nif, client_address: docMeta.address,
    location: docMeta.location, event_time: docMeta.time,
  };
  const {data, error} = await sb.from('documents').insert(payload).select().single();
  if(error){ toast('Error al guardar'); console.error(error); return; }
  printDoc({...data, clients:{name:client?.name}});
  let gigMsg = '';
  if(docMeta.createGig && docMeta.gigDate){
    const {error: gigError} = await sb.from('gigs').insert({
      client_id: clientId, place: docMeta.location, event_date: docMeta.gigDate, event_time: docMeta.time,
      price: total, magician_status: 'pendiente',
    });
    gigMsg = gigError ? ' (el bolo no se pudo crear)' : ' y bolo creado';
  }
  docItems = [{desc:'',price:0}];
  docMeta = { clientId:'', date:todayLocalStr(), fiscalName:'', nif:'', address:'', location:'', time:'', gigDate:'', createGig:true };
  await loadAll(); render(); toast('Documento generado' + gigMsg);
}
async function deleteDoc(id){
  if(!confirm('¿Borrar este documento? No se puede deshacer.')) return;
  await sb.from('documents').delete().eq('id', id);
  await loadAll(); render(); toast('Documento borrado');
}

function renderCalc(){
  const total = Number(document.getElementById('calc-total')?.value || 0);

  const mago = total - comision;
  const el = document.getElementById('calc-result');
  if(el) el.innerHTML = `

function exportFinanzasCSV(){
  const gigsMonth = STATE.gigs.filter(g => {

  const facturado = gigsMonth.reduce((s,g)=>s+Number(g.price),0);
  const comision = facturado * (financePct/100);
  const gastos = expensesMonth.reduce((s,e)=>s+Number(e.amount),0);
  const neto = comision - gastos;

  let rows = [];
  rows.push(['Finanzas', financeMonth]);

  rows.push([]);
  rows.push(['Resumen']);
  rows.push(['Facturado', facturado.toFixed(2)]);
  rows.push([`Comisión (${financePct}%)`, comision.toFixed(2)]);
  rows.push(['Gastos', gastos.toFixed(2)]);
  rows.push(['Ganancia neta', neto.toFixed(2)]);

  const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `finanzas-${financeMonth}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Excel descargado');
}

// ---------------- BOLOS (archivo agrupado) ----------------
let bolosGroupBy = 'mes';
let bolosShowAll = false;
let bolosSelected = null; // set on first render per group type

function isoWeek(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  const week = Math.ceil((((date - yearStart) / 86400000) + 1)/7);
  return `${date.getUTCFullYear()}-W${String(week).padStart(2,'0')}`;
}
function groupKey(dateStr){
  const d = new Date(dateStr);
  if(bolosGroupBy==='semana') return isoWeek(d);
  if(bolosGroupBy==='año') return String(d.getFullYear());
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function groupLabel(key){
  if(bolosGroupBy==='semana'){
    const [y,w] = key.split('-W');
    return `Semana ${w} · ${y}`;
  }
  if(bolosGroupBy==='año') return key;
  const [y,m] = key.split('-');
  return new Date(Number(y), Number(m)-1, 1).toLocaleDateString('es-ES', {month:'long', year:'numeric'});
}
function defaultPeriod(){
  const now = new Date();
  if(bolosGroupBy==='semana') return isoWeek(now);
  if(bolosGroupBy==='año') return String(now.getFullYear());
  return now.toISOString().slice(0,7);
}
function setBolosGroup(g){
  bolosGroupBy = g;
  bolosSelected = defaultPeriod();
  render();
}

  if(bolosSelected===null) bolosSelected = defaultPeriod();
  const withDate = STATE.gigs.filter(g=>g.event_date).sort((a,b)=>new Date(b.event_date)-new Date(a.event_date));
  const groups = {};
  withDate.forEach(g=>{
    const key = groupKey(g.event_date);
    if(!groups[key]) groups[key] = [];
    groups[key].push(g);
  });
  const keys = Object.keys(groups).sort().reverse();
  const visibleKeys = bolosShowAll ? keys : keys.filter(k=>k===bolosSelected);

  const years = [...new Set(withDate.map(g=>String(new Date(g.event_date).getFullYear())))].sort().reverse();

    ? `<input type="month" value="${bolosSelected}" onchange="bolosSelected=this.value; bolosShowAll=false; render()" style="width:auto" />`

    ? `<input type="week" value="${bolosSelected}" onchange="bolosSelected=this.value; bolosShowAll=false; render()" style="width:auto" />`
    : `<select onchange="bolosSelected=this.value; bolosShowAll=false; render()" style="width:auto">${years.map(y=>`<option value="${y}" ${y===bolosSelected?'selected':''}>${y}</option>`).join('')}</select>`;

        ${['semana','mes','año'].map(g=>`<button class="chip ${bolosGroupBy===g?'active':''}" onclick="setBolosGroup('${g}')" style="text-transform:capitalize">${g}</button>`).join('')}
        ${selectorHtml}

    <p style="font-size:13.5px;color:var(--muted);margin-bottom:24px">${withDate.length} bolo${withDate.length!==1?'s':''} registrado${withDate.length!==1?'s':''} en total.</p>

    ${visibleKeys.length===0?'<p style="color:var(--muted);font-size:13.5px">Sin bolos en este periodo.</p>':''}

            <h3 style="font-size:14px;font-weight:700;color:var(--gold-btn);text-transform:capitalize">${groupLabel(key)}</h3>
            <span style="font-size:13px;color:var(--muted)">${items.length} bolo${items.length!==1?'s':''} · ${total.toFixed(2)}€</span>
          </div>
          <div class="card" style="padding:0;overflow:hidden">
            ${items.map(g=>`<div class="row" onclick="openGigDetail('${g.id}')">
              <div style="width:44px;height:44px;border-radius:10px;background:var(--warm);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0">
                <div style="font-size:14px;font-weight:700;color:var(--gold-btn)">${new Date(g.event_date).getDate()}</div>
                <div style="font-size:9px;color:var(--muted);text-transform:uppercase">${new Date(g.event_date).toLocaleDateString('es-ES',{month:'short'})}</div>

let magoComunidadFilter = 'todas';

function magoStats(magoId){
  const gigs = STATE.gigs.filter(g=>g.magician_id===magoId);
  const total = gigs.reduce((s,g)=>s+(Number(g.price)||0),0);
  return { count: gigs.length, total };
}

async function addMagoVideoLink(magoId){
  const input = document.getElementById('mg-video-link');
  const url = input.value.trim();
  if(!url){ toast('Pega primero un enlace'); return; }
  if(!url.startsWith('http')){ toast('El enlace no parece válido (debe empezar por https://)'); return; }
  const m = STATE.magicians.find(x=>x.id===magoId);
  const current = [...(m.videos || [])];
  let label = 'Enlace de vídeo';
  if(url.includes('drive.google.com')) label = 'Google Drive';
  if(url.includes('youtube.com') || url.includes('youtu.be')) label = 'YouTube';
  current.push({url, name: label, path: null});
  const {error} = await sb.from('magicians').update({videos: current}).eq('id', magoId);
  if(error){ alert('Error al guardar el enlace: ' + error.message); console.error(error); return; }
  await loadAll();
  closeDrawer(); openMagoDetail(magoId);
  toast('Enlace guardado');
}
function triggerUpload(magoId, field, inputId){
  const input = document.getElementById(inputId);
  const file = input.files[0];
  if(!file){ alert('Primero elige un archivo con "Seleccionar archivo", y luego dale a este botón.'); return; }
  uploadMagoFile(magoId, field, file);
}
async function uploadMagoFile(magoId, field, file){
  const statusId = field==='photos' ? 'mg-photo-status' : field==='videos' ? 'mg-video-status' : 'mg-card-status';
  const status = document.getElementById(statusId);
  const setStatus = (txt) => { if(status) status.textContent = txt; };
  setStatus('Subiendo "' + file.name + '"... espera, puede tardar según el tamaño.');
  try {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const path = `${magoId}/${field}/${Date.now()}-${safeName}`;
    const {error: upErr} = await sb.storage.from('magos-media').upload(path, file);
    if(upErr){
      setStatus('❌ Error al subir: ' + upErr.message);
      alert('Error al subir el archivo: ' + upErr.message);
      console.error(upErr);
      return;
    }
    const {data:{publicUrl}} = sb.storage.from('magos-media').getPublicUrl(path);
    const m = STATE.magicians.find(x=>x.id===magoId);
    const current = [...(m[field] || [])];
    current.push({url: publicUrl, name: file.name, path});
    const {error: updErr} = await sb.from('magicians').update({[field]: current}).eq('id', magoId);
    if(updErr){
      setStatus('❌ Se subió pero no se pudo guardar: ' + updErr.message);
      alert('El archivo se subió pero no se pudo guardar en la ficha: ' + updErr.message);
      console.error(updErr);
      return;
    }
    setStatus('✅ ¡Subido correctamente!');
    await loadAll();
    closeDrawer(); openMagoDetail(magoId);
  } catch(e){
    setStatus('❌ Error inesperado: ' + e.message);
    alert('Error inesperado al subir: ' + e.message);
    console.error(e);
  }
}
async function removeMagoFile(magoId, field, index){
  const m = STATE.magicians.find(x=>x.id===magoId);
  const current = [...(m[field]||[])];
  const [removed] = current.splice(index,1);
  if(removed?.path) await sb.storage.from('magos-media').remove([removed.path]);
  await sb.from('magicians').update({[field]: current}).eq('id', magoId);
  await loadAll(); toast('Archivo borrado');
  closeDrawer(); openMagoDetail(magoId);
}

const MESES_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function billingMonthSelects(idPrefix, currentValue){
  const now = new Date();
  const [curY, curM] = (currentValue || '').split('-');
  const selectedY = curY || String(now.getFullYear());
  const selectedM = curM || String(now.getMonth()+1).padStart(2,'0');
  const years = [];
  for(let y = now.getFullYear()-1; y <= now.getFullYear()+1; y++) years.push(String(y));
  return `
    <select id="${idPrefix}-m" style="flex:1">
      <option value="" ${!curM?'selected':''}>Sin especificar</option>
      ${MESES_ES.map((name,i)=>{
        const val = String(i+1).padStart(2,'0');
        return `<option value="${val}" ${val===selectedM && curM ?'selected':''}>${name}</option>`;
      }).join('')}
    </select>
    <select id="${idPrefix}-y" style="width:100px">
      ${years.map(y=>`<option value="${y}" ${y===selectedY?'selected':''}>${y}</option>`).join('')}
    </select>`;
}
function readBillingMonth(idPrefix){
  const m = document.getElementById(idPrefix+'-m').value;
  const y = document.getElementById(idPrefix+'-y').value;
  return m ? `${y}-${m}` : null;
}

function todayLocalStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function avatarInitials(name){
  if(!name) return {initials:'?', color:'#94A3B8'};
  const parts = name.trim().split(/\s+/);
  const initials = (parts[0][0] + (parts[1]?parts[1][0]:'')).toUpperCase();
  let hash = 0;
  for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
  const color = AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
  return {initials, color};
}
function fmtDate(d){
  if(!d) return '—';
  return new Date(d).toLocaleDateString('es-ES', {day:'2-digit', month:'short', year: 'numeric'});
}
