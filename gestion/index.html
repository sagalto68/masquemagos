<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C4973D; --gold-btn:#8a6425; --warm:#FFFBF3; --white:#fff;
  --text:#1A1005; --muted:#6B5640; --border:rgba(196,151,61,.2);
  --dark:#1C140A; --dark-accent:#E8C37A;
}
body{background:var(--warm);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Fraunces',serif}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}

/* ---- login gate ---- */
#gate{position:fixed;inset:0;background:var(--dark);display:flex;align-items:center;justify-content:center;z-index:999}
#gate .box{background:#fff;border-radius:20px;padding:40px 36px;width:320px;text-align:center}
#gate h1{font-size:22px;margin-bottom:4px;color:var(--gold-btn)}
#gate p{font-size:13px;color:var(--muted);margin-bottom:20px}
#gate input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);font-size:15px;margin-bottom:12px}
#gate button{width:100%;padding:12px;border-radius:10px;border:none;background:var(--gold-btn);color:#fff;font-weight:600;font-size:14px}
#gate .err{color:#B91C1C;font-size:12.5px;margin-top:8px;display:none}

/* ---- app shell ---- */
#app{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--dark);color:#F5EFE4;display:flex;flex-direction:column;flex-shrink:0}
.sidebar .brand{padding:24px 20px;border-bottom:1px solid rgba(245,239,228,.1)}
.sidebar .brand b{font-family:'Fraunces',serif;font-size:19px;color:var(--dark-accent);display:block}
.sidebar .brand span{font-size:11px;color:rgba(245,239,228,.5);letter-spacing:.05em}
.sidebar nav{padding:16px 12px;flex:1}
.sidebar nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-bottom:4px;border-radius:10px;border:none;background:transparent;color:rgba(245,239,228,.75);font-size:14px;font-weight:500;text-align:left}
.sidebar nav button.active{background:rgba(232,195,122,.15);color:var(--dark-accent)}
.sidebar .foot{padding:16px;font-size:11px;color:rgba(245,239,228,.35);border-top:1px solid rgba(245,239,228,.1)}
main{flex:1;padding:32px 36px;overflow-y:auto;max-height:100vh}

.mobile-topbar{display:none}
@media(max-width:820px){
  .layout{flex-direction:column}
  .mobile-topbar{display:flex;align-items:center;justify-content:space-between;background:var(--dark);color:var(--dark-accent);padding:14px 18px;position:sticky;top:0;z-index:50}
  .mobile-topbar b{font-family:'Fraunces',serif;font-size:17px}
  .mobile-topbar button{background:none;border:none;color:var(--dark-accent);font-size:22px;padding:4px 8px}
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:240px;max-width:80vw;
    transform:translateX(-100%);transition:transform .25s ease;z-index:100;
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
  .sidebar-overlay.open{display:block}
  main{padding:20px 16px;max-height:none}
  .drawer{max-width:100vw!important;width:100vw!important}
  div[style*="grid-template-columns:1fr 340px"],
  div[style*="grid-template-columns:1fr 320px"]{grid-template-columns:1fr!important}
  div[style*="grid-template-columns:repeat(3,1fr)"],
  div[style*="grid-template-columns:repeat(4,1fr)"]{grid-template-columns:1fr 1fr!important}
  div[style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr!important}
}

.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;white-space:nowrap}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--gold-btn);color:#fff;border:none;padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600}
.btn.secondary{background:#fff;color:var(--muted);border:1px solid var(--border)}
.chip{padding:8px 14px;border-radius:100px;border:1px solid var(--border);background:#fff;color:var(--muted);font-size:12.5px;font-weight:600}
.chip.active{background:var(--gold-btn);border-color:var(--gold-btn);color:#fff}
.chip-sm{padding:6px 12px;border-radius:100px;border:1px solid rgba(107,86,64,.2);background:transparent;color:var(--muted);font-size:12px}
.chip-sm.active{background:#F1EBDD;font-weight:700}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],select,textarea{padding:9px 12px;border-radius:10px;border:1px solid var(--border);font-size:13.5px;width:100%}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
label.f{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px}

.row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid #F1EBDD;cursor:pointer}
.row:last-child{border-bottom:none}
.row-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}

#toast{position:fixed;bottom:24px;right:24px;background:var(--dark);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;opacity:0;transform:translateY(10px);transition:all .25s ease;z-index:200}
#toast.show{opacity:1;transform:translateY(0)}

.drawer-bg{position:fixed;inset:0;background:rgba(26,16,5,.4);display:flex;justify-content:flex-end;z-index:100}
.drawer{width:420px;max-width:90vw;background:#fff;height:100%;padding:28px;overflow-y:auto}

@media print{
  body *{visibility:hidden}
  #print-area, #print-area *{visibility:visible}
  #print-area{position:absolute;top:0;left:0;width:100%;padding:40px}
}
#print-area{position:fixed;left:-9999px;top:0;width:680px}
</style>

const TYPE_STYLES = {
  particular: { label:'Particular', bg:'#EEF2FF', text:'#4338CA', icon:'👤' },
  empresa: { label:'Empresa', bg:'#F0FDF4', text:'#15803D', icon:'🏢' },
  ayuntamiento: { label:'Ayuntamiento', bg:'#FEF3C7', text:'#92400E', icon:'🏛️' },
};
const STATUS_STYLES = {
  nuevo: { label:'Nuevo', bg:'#F1F5F9', text:'#475569' },
  contactado: { label:'Contactado', bg:'#DBEAFE', text:'#1D4ED8' },
  presupuestado: { label:'Presupuestado', bg:'#FEF3C7', text:'#92400E' },
  confirmado: { label:'Confirmado', bg:'#DCFCE7', text:'#166534' },
  perdido: { label:'Perdido', bg:'#FEE2E2', text:'#991B1B' },
};
function badge(style){ return `<span class="badge" style="background:${style.bg};color:${style.text}">${style.label}</span>`; }

let STATE = { clients:[], calls:[], docs:[], gigs:[], expenses:[], magicians:[], typeFilter:'todos', statusFilter:'todos', search:'', route:'dashboard' };
const CCAA = ['Andalucía','Aragón','Asturias','Islas Baleares','Canarias','Cantabria','Castilla-La Mancha','Castilla y León','Cataluña','Extremadura','Galicia','La Rioja','Madrid','Murcia','Navarra','País Vasco','Comunidad Valenciana','Ceuta','Melilla'];
let financeMonth = new Date().toISOString().slice(0,7); // YYYY-MM
let financePct = 20;

const NAV_ITEMS = [
  {id:'dashboard', label:'Resumen', icon:'🏠'},
  {id:'clientes', label:'Clientes', icon:'👥'},
  {id:'calendario', label:'Calendario', icon:'📅'},
  {id:'bolos', label:'Bolos', icon:'🎩'},
  {id:'magos', label:'Magos', icon:'🪄'},
  {id:'llamadas', label:'Llamadas', icon:'📞'},
  {id:'presupuestos', label:'Presupuestos', icon:'📄'},
  {id:'documentos', label:'Documentos', icon:'🗂️'},
  {id:'calculadora', label:'Comisión', icon:'🧮'},
  {id:'finanzas', label:'Finanzas', icon:'💰'},
  {id:'emails', label:'Emails', icon:'✉️'},
];

function renderNav(){
  document.getElementById('nav').innerHTML = NAV_ITEMS.map(it => `
    <button class="${STATE.route===it.id?'active':''}" onclick="goTo('${it.id}')">${it.icon} &nbsp;${it.label}</button>
  `).join('');
}
function goTo(route){ STATE.route = route; renderNav(); render(); closeSidebar(); }
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

async function loadAll(){
  const [{data:clients}, {data:calls}, {data:docs}, {data:gigs}, {data:expenses}, {data:magicians}] = await Promise.all([
    sb.from('clients').select('*, notes(*)').order('created_at', {ascending:false}),
    sb.from('calls').select('*, clients(name)').eq('done', false).order('due_date'),
    sb.from('documents').select('*, clients(name)').order('created_at', {ascending:false}),
    sb.from('gigs').select('*, clients(name, type), magicians(name)').order('event_date', {ascending:true, nullsFirst:false}),
    sb.from('expenses').select('*').order('expense_date', {ascending:false}),
    sb.from('magicians').select('*').order('name'),
  ]);
  STATE.clients = clients || [];
  STATE.calls = calls || [];
  STATE.docs = docs || [];
  STATE.gigs = gigs || [];
  STATE.expenses = expenses || [];
  STATE.magicians = magicians || [];
}

async function boot(){
  renderNav();
  await loadAll();
  render();
}

function render(){
  const main = document.getElementById('main');
  if(STATE.route==='dashboard') main.innerHTML = viewDashboard();
  if(STATE.route==='clientes') main.innerHTML = viewClientes();
  if(STATE.route==='calendario') main.innerHTML = viewCalendario();
  if(STATE.route==='bolos') main.innerHTML = viewBolos();
  if(STATE.route==='magos') main.innerHTML = viewMagos();
  if(STATE.route==='llamadas') main.innerHTML = viewLlamadas();
  if(STATE.route==='presupuestos') main.innerHTML = viewPresupuestos();
  if(STATE.route==='documentos') main.innerHTML = viewDocumentos();
  if(STATE.route==='calculadora'){ main.innerHTML = viewCalculadora(); renderCalc(); }
  if(STATE.route==='finanzas') main.innerHTML = viewFinanzas();
  if(STATE.route==='emails') main.innerHTML = viewEmails();
}

// ---------------- DASHBOARD ----------------
function viewDashboard(){
  const activos = STATE.clients.filter(c => !['perdido','confirmado'].includes(c.status)).length;
  const confirmados = STATE.gigs.filter(g => g.event_date && new Date(g.event_date) >= new Date().setHours(0,0,0,0)).length;
  const pendientes = STATE.calls.length;
  const proximosBolos = STATE.gigs.filter(g=>g.event_date).sort((a,b)=>new Date(a.event_date)-new Date(b.event_date)).slice(0,4);
  return `
    <h1 style="font-size:26px;margin-bottom:4px">Buenos días 👋</h1>
    <p style="color:var(--muted);margin-bottom:28px;font-size:14px">Esto es lo que tenéis hoy sobre la mesa.</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px">
      <div class="card"><div style="font-size:28px;font-weight:700;color:var(--gold-btn)">${activos}</div><div style="font-size:13px;color:var(--muted)">Leads activos</div></div>
      <div class="card"><div style="font-size:28px;font-weight:700;color:#166534">${confirmados}</div><div style="font-size:13px;color:var(--muted)">Bolos confirmados</div></div>
      <div class="card"><div style="font-size:28px;font-weight:700;color:#1D4ED8">${pendientes}</div><div style="font-size:13px;color:var(--muted)">Llamadas pendientes</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div class="card">
        <h3 style="font-size:16px;margin-bottom:14px">Llamadas pendientes</h3>
        ${STATE.calls.slice(0,4).map(c=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F1EBDD">
          <div><div style="font-size:14px;font-weight:600">${c.clients?.name||'—'}</div><div style="font-size:12.5px;color:var(--muted)">${c.reason}</div></div>
          <span style="font-size:12px;color:var(--gold-btn);font-weight:600">${fmtDate(c.due_date)}</span></div>`).join('') || '<p style="font-size:13px;color:var(--muted)">Ninguna pendiente 🎉</p>'}
      </div>
      <div class="card">
        <h3 style="font-size:16px;margin-bottom:14px">Próximos bolos</h3>
        ${proximosBolos.map(g=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F1EBDD">
          <div><div style="font-size:14px;font-weight:600">${g.clients?.name||'—'}</div><div style="font-size:12.5px;color:var(--muted)">${g.place||'—'}</div></div>
          <span style="font-size:12px;color:var(--muted)">${fmtDate(g.event_date)}</span></div>`).join('') || '<p style="font-size:13px;color:var(--muted)">Sin fechas confirmadas todavía</p>'}
      </div>
    </div>
  `;
}

// ---------------- CLIENTES ----------------
function viewClientes(){
  const filtered = STATE.clients.filter(c =>
    (STATE.typeFilter==='todos' || c.type===STATE.typeFilter) &&
    (STATE.statusFilter==='todos' || c.status===STATE.statusFilter) &&
    c.name.toLowerCase().includes(STATE.search.toLowerCase())
  );
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h1 style="font-size:24px">Clientes y leads</h1>
      <button class="btn" onclick="openClientForm()">+ Nuevo cliente</button>
    </div>
    <input type="text" placeholder="Buscar cliente..." style="max-width:280px;margin-bottom:14px" value="${STATE.search}" oninput="STATE.search=this.value; render()" />
    <div style="display:flex;gap:8px;margin-bottom:10px">
      ${['todos','particular','empresa','ayuntamiento'].map(f=>`<button class="chip ${STATE.typeFilter===f?'active':''}" onclick="STATE.typeFilter='${f}'; render()">${f}</button>`).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)">
      ${['todos','nuevo','contactado','presupuestado','confirmado','perdido'].map(s=>`<button class="chip-sm ${STATE.statusFilter===s?'active':''}" onclick="STATE.statusFilter='${s}'; render()">${s==='todos'?'Todos los estados':STATUS_STYLES[s].label}</button>`).join('')}
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      ${filtered.length===0?'<div style="padding:24px;text-align:center;color:var(--muted);font-size:13.5px">Ningún cliente coincide con este filtro.</div>':''}
      ${filtered.map(c=>{
        const t=TYPE_STYLES[c.type], s=STATUS_STYLES[c.status];
        return `<div class="row" onclick="openClientDetail('${c.id}')">
          <div class="row-icon" style="background:${t.bg}">${t.icon}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14.5px;font-weight:600">${c.name}</div>
            <div style="font-size:12.5px;color:var(--muted)">${c.event_type||'—'} - ${c.phone||'—'} - ${c.email||'—'}</div>
          </div>
          ${badge(s)}
        </div>`;
      }).join('')}
    </div>
  `;
}

function openClientForm(){
  const html = `
    <div class="drawer-bg">
      <div class="drawer" onclick="event.stopPropagation()">
        <h2 style="font-size:21px;margin-bottom:20px">Nuevo cliente</h2>
        <div style="display:grid;gap:12px">
          <div><label class="f">Nombre</label><input type="text" id="nc-name" /></div>
          <div><label class="f">Tipo</label><select id="nc-type"><option value="particular">Particular</option><option value="empresa">Empresa</option><option value="ayuntamiento">Ayuntamiento</option></select></div>
          <div><label class="f">Tipo de evento</label><input type="text" id="nc-event" placeholder="Comunión, boda, cena de empresa..." /></div>
          <div><label class="f">Teléfono</label><input type="tel" id="nc-phone" /></div>
          <div><label class="f">Email</label><input type="email" id="nc-email" /></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div><label class="f">Población</label><input type="text" id="nc-locality" placeholder="Ej: Sitges" /></div>
            <div><label class="f">Provincia</label><input type="text" id="nc-province" placeholder="Ej: Barcelona" /></div>
          </div>
          <div><label class="f">Origen</label><input type="text" id="nc-source" placeholder="Web, Instagram, Google Ads..." /></div>
          <div><label class="f">Fecha del evento (si ya la sabéis)</label><input type="date" id="nc-date" /></div>
          <button class="btn" style="margin-top:8px" onclick="saveClient()">Guardar cliente</button>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}
async function saveClient(){
  const payload = {
    name: document.getElementById('nc-name').value,
    type: document.getElementById('nc-type').value,
    event_type: document.getElementById('nc-event').value,
    phone: document.getElementById('nc-phone').value,
    email: document.getElementById('nc-email').value,
    locality: document.getElementById('nc-locality').value,
    province: document.getElementById('nc-province').value,
    source: document.getElementById('nc-source').value,
    event_date: document.getElementById('nc-date').value || null,
  };
  if(!payload.name){ toast('Ponle un nombre al cliente'); return; }
  const {error} = await sb.from('clients').insert(payload);
  if(error){ toast('Error al guardar'); console.error(error); return; }
  closeDrawer(); await loadAll(); render(); toast('Cliente guardado');
}

async function openClientDetail(id){
  const c = STATE.clients.find(x=>x.id===id);
  const t=TYPE_STYLES[c.type];
  const notes = (c.notes||[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const gigs = STATE.gigs.filter(g=>g.client_id===id).sort((a,b)=>new Date(b.event_date||0)-new Date(a.event_date||0));
  const html = `

function closeDrawer(e){
  if(e && e.target !== e.currentTarget) return;
  const all = document.querySelectorAll('.drawer-bg');
  if(all.length) all[all.length-1].remove();
}
function closeAllDrawers(){
  document.querySelectorAll('.drawer-bg').forEach(el=>el.remove());
}
async function updateStatus(id, status){
  await sb.from('clients').update({status}).eq('id', id);
  await loadAll(); render(); toast('Estado actualizado');
}
async function saveClientEdits(id){
  const payload = {
    name: document.getElementById('cd-name').value,
    type: document.getElementById('cd-type').value,
    event_type: document.getElementById('cd-event').value,
    phone: document.getElementById('cd-phone').value,
    email: document.getElementById('cd-email').value,
    locality: document.getElementById('cd-locality').value,
    province: document.getElementById('cd-province').value,
    source: document.getElementById('cd-source').value,
  };
  if(!payload.name){ toast('El nombre no puede quedar vacío'); return; }
  await sb.from('clients').update(payload).eq('id', id);
  closeDrawer(); await loadAll(); render(); toast('Cliente actualizado');
}
async function deleteClient(id){
  if(!confirm('¿Seguro que quieres borrar este cliente? Se borrarán también sus notas, bolos y llamadas asociadas. Esto no se puede deshacer.')) return;
  await sb.from('clients').delete().eq('id', id);
  closeDrawer(); await loadAll(); render(); toast('Cliente borrado');
}
async function addNote(clientId){
  const text = document.getElementById('cd-note').value;
  if(!text) return;
  await sb.from('notes').insert({client_id: clientId, text});
  closeDrawer(); await loadAll(); render(); toast('Nota guardada');
  openClientDetail(clientId);
}
async function addCall(clientId){
  const reason = document.getElementById('cd-call-reason').value;
  const due = document.getElementById('cd-call-date').value;
  if(!reason || !due){ toast('Rellena motivo y fecha'); return; }
  await sb.from('calls').insert({client_id: clientId, reason, due_date: due});
  closeDrawer(); await loadAll(); render(); toast('Llamada programada');
}
async function addGig(clientId){
  const place = document.getElementById('ng-place').value;
  const date = document.getElementById('ng-date').value;
  const time = document.getElementById('ng-time').value;
  const magicianId = document.getElementById('ng-magician').value;
  const magicianObj = STATE.magicians.find(m=>m.id===magicianId);
  const price = document.getElementById('ng-price').value;
  if(!date){ toast('Ponle al menos una fecha al bolo'); return; }
  await sb.from('gigs').insert({client_id: clientId, place, event_date: date, event_time: time, magician_id: magicianId||null, magician: magicianObj?.name||null, price: price?Number(price):null});
  const feedbackDate = new Date(date);
  feedbackDate.setDate(feedbackDate.getDate() + 1);
  await sb.from('calls').insert({
    client_id: clientId,
    reason: `Pedir feedback del bolo${place?' en '+place:''}`,
    due_date: feedbackDate.toISOString().slice(0,10),
    kind: 'feedback',
  });
  closeDrawer(); await loadAll(); render(); toast('Bolo guardado y feedback programado para el día siguiente');
  openClientDetail(clientId);
}
async function deleteGig(gigId, clientId){
  if(!confirm('¿Borrar este bolo?')) return;
  await sb.from('gigs').delete().eq('id', gigId);
  closeAllDrawers(); await loadAll(); render();
  if(clientId) openClientDetail(clientId);
  toast('Bolo borrado');
}
async function promptFeedback(gigId, clientId){
  const feedback = prompt('Feedback del cliente sobre este bolo:');
  if(!feedback) return;
  await sb.from('gigs').update({feedback}).eq('id', gigId);
  closeAllDrawers(); await loadAll(); render();
  if(clientId) openClientDetail(clientId);
  toast('Feedback guardado');
}

async function generateDoc(){
  const {subtotal, iva, total} = updateTotalsDisplay();
  const clientId = docMeta.clientId;
  const client = STATE.clients.find(c=>c.id===clientId);
  if(!docMeta.fiscalName || docItems.every(it=>!it.desc)){ toast('Rellena el nombre fiscal y al menos un concepto'); return; }
  const seq = await nextDocSeq(docType);
  const payload = {
    client_id: clientId, doc_number: String(seq), doc_seq: seq, doc_type: docType,
    items: docItems, subtotal, iva, total, doc_date: docMeta.date,
    client_fiscal_name: docMeta.fiscalName, client_nif: docMeta.nif, client_address: docMeta.address,
    location: docMeta.location, event_time: docMeta.time,
  };
  const {data, error} = await sb.from('documents').insert(payload).select().single();
  if(error){ toast('Error al guardar'); console.error(error); return; }
  printDoc({...data, clients:{name:client?.name}});
  docItems = [{desc:'',price:0}];
  docMeta = { clientId:'', date:new Date().toISOString().slice(0,10), fiscalName:'', nif:'', address:'', location:'', time:'' };
  await loadAll(); render(); toast('Documento generado');
}
async function deleteDoc(id){
  if(!confirm('¿Borrar este documento? No se puede deshacer.')) return;
  await sb.from('documents').delete().eq('id', id);
  await loadAll(); render(); toast('Documento borrado');
}

function viewCalculadora(){
  return `
    <h1 style="font-size:24px;margin-bottom:6px">Calculadora de comisión</h1>
    <p style="font-size:13.5px;color:var(--muted);margin-bottom:24px;max-width:480px">Introduce lo que le cobras al cliente y vuestro % de comisión — calcula cuánto os quedáis y cuánto recibe el mago.</p>

      <label class="f">Lo que le cobras al cliente (€)</label>
      <input type="number" id="calc-total" value="300" oninput="renderCalc()" style="font-size:16px;font-weight:600;margin-bottom:18px" />
      <label class="f">Vuestra comisión (%)</label>
      <input type="number" id="calc-pct" value="20" oninput="renderCalc()" style="font-size:16px;font-weight:600;margin-bottom:22px" />
      <div id="calc-result"></div>

}
function renderCalc(){
  const total = Number(document.getElementById('calc-total')?.value || 0);
  const pct = Number(document.getElementById('calc-pct')?.value || 0);
  const comision = total * (pct/100);
  const mago = total - comision;
  const el = document.getElementById('calc-result');
  if(el) el.innerHTML = `
    <div style="background:var(--warm);border-radius:12px;padding:16px 18px;display:grid;gap:10px">
      <div style="display:flex;justify-content:space-between;font-size:14px"><span style="color:var(--muted)">Total cobrado al cliente</span><strong>${total.toFixed(2)}€</strong></div>
      <div style="display:flex;justify-content:space-between;font-size:14px"><span style="color:var(--muted)">El mago recibe</span><strong>${mago.toFixed(2)}€</strong></div>
      <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;border-top:1px solid rgba(196,151,61,.25);padding-top:10px"><span>Vuestra comisión (${pct}%)</span><span style="color:var(--gold-btn)">${comision.toFixed(2)}€</span></div>
    </div>`;
}

function copyEmails(){
  const localities = [...new Set(STATE.clients.map(c=>c.locality).filter(Boolean))];
  const matched = STATE.clients.filter(c => emailTypeFilter[c.type] && (emailLocalityFilter==='todas' || c.locality===emailLocalityFilter) && c.email);
  const list = matched.map(c=>c.email).join(', ');
  if(!list){ toast('No hay emails que coincidan con el filtro'); return; }
  navigator.clipboard.writeText(list);
  toast(`${matched.length} emails copiados al portapapeles`);
}
function openMailClient(){
  const matched = STATE.clients.filter(c => emailTypeFilter[c.type] && (emailLocalityFilter==='todas' || c.locality===emailLocalityFilter) && c.email);
  const subject = document.getElementById('email-subject').value;
  const body = document.getElementById('email-body').value;
  if(matched.length===0){ toast('No hay emails que coincidan con el filtro'); return; }
  const bcc = matched.map(c=>c.email).join(',');
  window.location.href = `mailto:?bcc=${encodeURIComponent(bcc)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

// ---------------- BOLOS (archivo agrupado) ----------------
let bolosGroupBy = 'mes';
let bolosShowAll = false;
let bolosSelected = null; // set on first render per group type

function isoWeek(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  const week = Math.ceil((((date - yearStart) / 86400000) + 1)/7);
  return `${date.getUTCFullYear()}-W${String(week).padStart(2,'0')}`;
}
function groupKey(dateStr){
  const d = new Date(dateStr);
  if(bolosGroupBy==='semana') return isoWeek(d);
  if(bolosGroupBy==='año') return String(d.getFullYear());
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function groupLabel(key){
  if(bolosGroupBy==='semana'){
    const [y,w] = key.split('-W');
    return `Semana ${w} · ${y}`;
  }
  if(bolosGroupBy==='año') return key;
  const [y,m] = key.split('-');
  return new Date(Number(y), Number(m)-1, 1).toLocaleDateString('es-ES', {month:'long', year:'numeric'});
}
function defaultPeriod(){
  const now = new Date();
  if(bolosGroupBy==='semana') return isoWeek(now);
  if(bolosGroupBy==='año') return String(now.getFullYear());
  return now.toISOString().slice(0,7);
}
function setBolosGroup(g){
  bolosGroupBy = g;
  bolosSelected = defaultPeriod();
  render();
}

function viewBolos(){
  if(bolosSelected===null) bolosSelected = defaultPeriod();
  const withDate = STATE.gigs.filter(g=>g.event_date).sort((a,b)=>new Date(b.event_date)-new Date(a.event_date));
  const groups = {};
  withDate.forEach(g=>{
    const key = groupKey(g.event_date);
    if(!groups[key]) groups[key] = [];
    groups[key].push(g);
  });
  const keys = Object.keys(groups).sort().reverse();
  const visibleKeys = bolosShowAll ? keys : keys.filter(k=>k===bolosSelected);

  const years = [...new Set(withDate.map(g=>String(new Date(g.event_date).getFullYear())))].sort().reverse();
  if(years.length===0) years.push(String(new Date().getFullYear()));

  const selectorHtml = bolosGroupBy==='mes'
    ? `<input type="month" value="${bolosSelected}" onchange="bolosSelected=this.value; bolosShowAll=false; render()" style="width:auto" />`
    : bolosGroupBy==='semana'
    ? `<input type="week" value="${bolosSelected}" onchange="bolosSelected=this.value; bolosShowAll=false; render()" style="width:auto" />`
    : `<select onchange="bolosSelected=this.value; bolosShowAll=false; render()" style="width:auto">${years.map(y=>`<option value="${y}" ${y===bolosSelected?'selected':''}>${y}</option>`).join('')}</select>`;

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
      <h1 style="font-size:24px">Bolos</h1>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${['semana','mes','año'].map(g=>`<button class="chip ${bolosGroupBy===g?'active':''}" onclick="setBolosGroup('${g}')" style="text-transform:capitalize">${g}</button>`).join('')}
        ${selectorHtml}
        <button class="chip ${bolosShowAll?'active':''}" onclick="bolosShowAll=!bolosShowAll; render()">Ver todos</button>
      </div>
    </div>
    <p style="font-size:13.5px;color:var(--muted);margin-bottom:24px">${withDate.length} bolo${withDate.length!==1?'s':''} registrado${withDate.length!==1?'s':''} en total.</p>

    ${visibleKeys.length===0?'<p style="color:var(--muted);font-size:13.5px">Sin bolos en este periodo.</p>':''}
    ${visibleKeys.map(key=>{
      const items = groups[key];
      const total = items.reduce((s,g)=>s+(Number(g.price)||0),0);
      return `
        <div style="margin-bottom:24px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <h3 style="font-size:14px;font-weight:700;color:var(--gold-btn);text-transform:capitalize">${groupLabel(key)}</h3>
            <span style="font-size:13px;color:var(--muted)">${items.length} bolo${items.length!==1?'s':''} · ${total.toFixed(2)}€</span>
          </div>
          <div class="card" style="padding:0;overflow:hidden">
            ${items.map(g=>`<div class="row" onclick="openGigDetail('${g.id}')">
              <div style="width:44px;height:44px;border-radius:10px;background:var(--warm);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0">
                <div style="font-size:14px;font-weight:700;color:var(--gold-btn)">${new Date(g.event_date).getDate()}</div>
                <div style="font-size:9px;color:var(--muted);text-transform:uppercase">${new Date(g.event_date).toLocaleDateString('es-ES',{month:'short'})}</div>
              </div>
              <div style="flex:1;min-width:0">
                <div style="font-size:13.5px;font-weight:600">${g.clients?.name||'—'}</div>
                <div style="font-size:12px;color:var(--muted)">${g.place||'Lugar sin especificar'} ${g.magician?'· '+g.magician:''}</div>
              </div>
              <strong style="font-size:13.5px">${g.price?Number(g.price).toFixed(2)+'€':'—'}</strong>
            </div>`).join('')}
          </div>
        </div>`;
    }).join('')}
  `;
}

// ---------------- MAGOS ----------------
let magoComunidadFilter = 'todas';
let magoSearch = '';

function magoStats(magoId){
  const gigs = STATE.gigs.filter(g=>g.magician_id===magoId);
  const total = gigs.reduce((s,g)=>s+(Number(g.price)||0),0);
  return { count: gigs.length, total };
}

function viewMagos(){
  const filtered = STATE.magicians.filter(m =>
    (magoComunidadFilter==='todas' || m.comunidad===magoComunidadFilter) &&
    m.name.toLowerCase().includes(magoSearch.toLowerCase())
  );
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h1 style="font-size:24px">Magos</h1>
      <button class="btn" onclick="openMagoForm()">+ Nuevo mago</button>
    </div>
    <input type="text" placeholder="Buscar mago..." value="${magoSearch}" oninput="magoSearch=this.value; render()" style="max-width:280px;margin-bottom:14px" />
    <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">
      <button class="chip ${magoComunidadFilter==='todas'?'active':''}" onclick="magoComunidadFilter='todas'; render()">Todas</button>
      ${CCAA.map(c=>`<button class="chip ${magoComunidadFilter===c?'active':''}" onclick="magoComunidadFilter='${c}'; render()">${c}</button>`).join('')}
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      ${filtered.length===0?'<div style="padding:24px;text-align:center;color:var(--muted);font-size:13.5px">Ningún mago coincide con este filtro.</div>':''}
      ${filtered.map(m=>{
        const stats = magoStats(m.id);
        return `<div class="row" onclick="openMagoDetail('${m.id}')">
          <div class="row-icon" style="background:#EEF2FF;font-size:18px">🪄</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14.5px;font-weight:600">${m.name}</div>
            <div style="font-size:12.5px;color:var(--muted)">${m.comunidad||'Sin comunidad'} ${m.phone?'· '+m.phone:''}</div>
          </div>
          <span style="font-size:12.5px;color:var(--muted);margin-right:8px">${stats.count} bolo${stats.count!==1?'s':''}</span>
          <strong style="font-size:13.5px">${stats.total.toFixed(2)}€</strong>
        </div>`;
      }).join('')}
    </div>
  `;
}

function openMagoForm(){
  const html = `
    <div class="drawer-bg">
      <div class="drawer" onclick="event.stopPropagation()">
        <h2 style="font-size:21px;margin-bottom:20px">Nuevo mago</h2>
        <div style="display:grid;gap:12px">
          <div><label class="f">Nombre</label><input type="text" id="nm-name" /></div>
          <div><label class="f">Teléfono</label><input type="tel" id="nm-phone" /></div>
          <div><label class="f">Email</label><input type="email" id="nm-email" /></div>
          <div><label class="f">Comunidad autónoma</label><select id="nm-comunidad">
            <option value="">Selecciona...</option>
            ${CCAA.map(c=>`<option value="${c}">${c}</option>`).join('')}
          </select></div>
          <div><label class="f">Notas</label><textarea id="nm-notes" style="min-height:70px"></textarea></div>
          <button class="btn" style="margin-top:8px" onclick="saveMago()">Guardar mago</button>
        </div>
        <button onclick="closeDrawer()" style="width:100%;margin-top:12px;background:none;border:1px solid var(--border);color:var(--muted);padding:10px;border-radius:10px;font-size:13px">Cancelar</button>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}
async function saveMago(){
  const payload = {
    name: document.getElementById('nm-name').value,
    phone: document.getElementById('nm-phone').value,
    email: document.getElementById('nm-email').value,
    comunidad: document.getElementById('nm-comunidad').value,
    notes: document.getElementById('nm-notes').value,
  };
  if(!payload.name){ toast('Ponle un nombre al mago'); return; }
  const {error} = await sb.from('magicians').insert(payload);
  if(error){ toast('Error al guardar: '+error.message); console.error(error); return; }
  closeDrawer(); await loadAll(); render(); toast('Mago guardado');
}

function openMagoDetail(id){

  const gigs = STATE.gigs.filter(g=>g.magician_id===id).sort((a,b)=>new Date(b.event_date||0)-new Date(a.event_date||0));
  const stats = magoStats(id);
  const photos = m.photos || [];
  const videos = m.videos || [];
  const cards = m.cards || [];
  const html = `
    <div class="drawer-bg">
      <div class="drawer" onclick="event.stopPropagation()">
        <div style="display:flex;justify-content:space-between;margin-bottom:20px">
          <h2 style="font-size:21px">${m.name}</h2>
          <button class="btn secondary" onclick="closeDrawer()" style="height:32px">✕</button>
        </div>

        <div style="display:grid;gap:10px;margin-bottom:10px">
          <div><label class="f">Nombre</label><input type="text" id="mg-name" value="${m.name||''}" /></div>
          <div><label class="f">Teléfono</label><input type="tel" id="mg-phone" value="${m.phone||''}" /></div>
          <div><label class="f">Email</label><input type="email" id="mg-email" value="${m.email||''}" /></div>
          <div><label class="f">Comunidad autónoma</label><select id="mg-comunidad">
            <option value="">Sin especificar</option>
            ${CCAA.map(c=>`<option value="${c}" ${m.comunidad===c?'selected':''}>${c}</option>`).join('')}
          </select></div>
          <div><label class="f">Notas</label><textarea id="mg-notes" style="min-height:60px">${m.notes||''}</textarea></div>
        </div>
        <button class="btn" style="width:100%;margin-bottom:20px" onclick="saveMagoEdits('${m.id}')">Guardar cambios</button>

        <div style="background:var(--warm);border-radius:10px;padding:12px 14px;margin-bottom:22px;display:flex;justify-content:space-between;font-size:13.5px">
          <span><strong>${stats.count}</strong> bolo${stats.count!==1?'s':''} hechos</span>
          <span><strong>${stats.total.toFixed(2)}€</strong> facturados</span>
        </div>

        <h3 style="font-size:15px;margin-bottom:10px">📷 Fotos</h3>
        <input type="file" id="mg-photo-input" accept="image/*" style="margin-bottom:8px" />
        <button class="btn secondary" style="margin-bottom:6px" onclick="triggerUpload('${m.id}','photos','mg-photo-input')">⬆ Subir foto</button>
        <p id="mg-photo-status" style="font-size:12px;color:var(--muted);margin-bottom:10px"></p>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px">
          ${photos.map((f,i)=>`<div style="position:relative">
            <a href="${f.url}" target="_blank"><img src="${f.url}" style="width:100%;height:70px;object-fit:cover;border-radius:8px" /></a>
            <button onclick="removeMagoFile('${m.id}','photos',${i})" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer">✕</button>
          </div>`).join('')}
        </div>

        <h3 style="font-size:15px;margin-bottom:10px">🎬 Vídeos</h3>
        <input type="file" id="mg-video-input" accept="video/*" style="margin-bottom:8px" />
        <button class="btn secondary" style="margin-bottom:6px" onclick="triggerUpload('${m.id}','videos','mg-video-input')">⬆ Subir vídeo</button>
        <p id="mg-video-status" style="font-size:12px;color:var(--muted);margin-bottom:10px"></p>
        <p style="font-size:11.5px;color:var(--muted);margin-bottom:6px">— o si el vídeo pesa mucho —</p>
        <div style="display:flex;gap:8px;margin-bottom:10px">
          <input type="text" id="mg-video-link" placeholder="Pega aquí el enlace de Google Drive/YouTube" style="flex:1" />
          <button class="btn secondary" style="flex-shrink:0" onclick="addMagoVideoLink('${m.id}')">Guardar</button>
        </div>
        <div style="display:grid;gap:8px;margin-bottom:20px">
          ${videos.map((f,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;background:var(--warm);border-radius:8px;padding:8px 12px;font-size:12.5px">
            <a href="${f.url}" target="_blank" download style="color:var(--gold-btn);font-weight:600">${f.name}</a>
            <button onclick="removeMagoFile('${m.id}','videos',${i})" style="background:none;border:none;color:#991B1B;cursor:pointer">✕</button>
          </div>`).join('') || '<p style="font-size:13px;color:var(--muted)">Sin vídeos.</p>'}
        </div>

        <h3 style="font-size:15px;margin-bottom:10px">🪪 Tarjetas</h3>
        <input type="file" id="mg-card-input" style="margin-bottom:8px" />

          ${cards.map((f,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;background:var(--warm);border-radius:8px;padding:8px 12px;font-size:12.5px">
            <a href="${f.url}" target="_blank" download style="color:var(--gold-btn);font-weight:600">⬇ ${f.name}</a>

          ${gigs.map(g=>`<div style="background:var(--warm);border-radius:10px;padding:10px 12px;font-size:12.5px">
            <strong>${g.event_date?fmtDate(g.event_date):'Sin fecha'}</strong> — ${g.clients?.name||'—'} ${g.price?'· '+Number(g.price).toFixed(2)+'€':''}

      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}
async function saveMagoEdits(id){
  const payload = {
    name: document.getElementById('mg-name').value,
    phone: document.getElementById('mg-phone').value,
    email: document.getElementById('mg-email').value,
    comunidad: document.getElementById('mg-comunidad').value,
    notes: document.getElementById('mg-notes').value,
  };
  if(!payload.name){ toast('El nombre no puede quedar vacío'); return; }
  await sb.from('magicians').update(payload).eq('id', id);
  closeDrawer(); await loadAll(); render(); toast('Mago actualizado');
}
async function deleteMago(id){
  if(!confirm('¿Borrar este mago? Los bolos que tenía asignados no se borrarán, pero perderán la referencia. No se puede deshacer.')) return;
  await sb.from('magicians').delete().eq('id', id);
  closeDrawer(); await loadAll(); render(); toast('Mago borrado');
}
async function addMagoVideoLink(magoId){
  const input = document.getElementById('mg-video-link');
  const url = input.value.trim();
  if(!url){ toast('Pega primero un enlace'); return; }
  if(!url.startsWith('http')){ toast('El enlace no parece válido (debe empezar por https://)'); return; }
  const m = STATE.magicians.find(x=>x.id===magoId);
  const current = [...(m.videos || [])];
  let label = 'Enlace de vídeo';
  if(url.includes('drive.google.com')) label = 'Google Drive';
  if(url.includes('youtube.com') || url.includes('youtu.be')) label = 'YouTube';
  current.push({url, name: label, path: null});
  const {error} = await sb.from('magicians').update({videos: current}).eq('id', magoId);
  if(error){ alert('Error al guardar el enlace: ' + error.message); console.error(error); return; }
  await loadAll();
  closeDrawer(); openMagoDetail(magoId);
  toast('Enlace guardado');
}
function triggerUpload(magoId, field, inputId){
  const input = document.getElementById(inputId);
  const file = input.files[0];
  if(!file){ alert('Primero elige un archivo con "Seleccionar archivo", y luego dale a este botón.'); return; }
  uploadMagoFile(magoId, field, file);
}
async function uploadMagoFile(magoId, field, file){
  const statusId = field==='photos' ? 'mg-photo-status' : field==='videos' ? 'mg-video-status' : 'mg-card-status';
  const status = document.getElementById(statusId);
  const setStatus = (txt) => { if(status) status.textContent = txt; };
  setStatus('Subiendo "' + file.name + '"... espera, puede tardar según el tamaño.');
  try {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const path = `${magoId}/${field}/${Date.now()}-${safeName}`;
    const {error: upErr} = await sb.storage.from('magos-media').upload(path, file);
    if(upErr){
      setStatus('❌ Error al subir: ' + upErr.message);
      alert('Error al subir el archivo: ' + upErr.message);
      console.error(upErr);
      return;
    }
    const {data:{publicUrl}} = sb.storage.from('magos-media').getPublicUrl(path);
    const m = STATE.magicians.find(x=>x.id===magoId);
    const current = [...(m[field] || [])];
    current.push({url: publicUrl, name: file.name, path});
    const {error: updErr} = await sb.from('magicians').update({[field]: current}).eq('id', magoId);
    if(updErr){
      setStatus('❌ Se subió pero no se pudo guardar: ' + updErr.message);
      alert('El archivo se subió pero no se pudo guardar en la ficha: ' + updErr.message);
      console.error(updErr);
      return;
    }
    setStatus('✅ ¡Subido correctamente!');
    await loadAll();
    closeDrawer(); openMagoDetail(magoId);
  } catch(e){
    setStatus('❌ Error inesperado: ' + e.message);
    alert('Error inesperado al subir: ' + e.message);
    console.error(e);
  }
}
async function removeMagoFile(magoId, field, index){
  const m = STATE.magicians.find(x=>x.id===magoId);
  const current = [...(m[field]||[])];
  const [removed] = current.splice(index,1);
  if(removed?.path) await sb.storage.from('magos-media').remove([removed.path]);
  await sb.from('magicians').update({[field]: current}).eq('id', magoId);
  await loadAll(); toast('Archivo borrado');
  closeDrawer(); openMagoDetail(magoId);
}

function fmtDate(d){
  if(!d) return '—';
  return new Date(d).toLocaleDateString('es-ES', {day:'2-digit', month:'short', year: 'numeric'});
}
